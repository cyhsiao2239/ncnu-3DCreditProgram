name: Keep Supabase alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase REST API
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_ANON_KEY}" ]]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets must be configured."
            exit 1
          fi

          endpoint="${SUPABASE_URL%/}/rest/v1/"
          http_code="$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${endpoint}")"

          case "${http_code}" in
            200|404)
              echo "Supabase REST API responded with HTTP ${http_code}; keep-alive succeeded."
              ;;
            *)
              echo "::error::Supabase REST API responded with unexpected HTTP ${http_code}."
              exit 1
              ;;
          esac
